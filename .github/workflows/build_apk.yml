name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: |
          cd android
          gradle assembleDebug --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/LuminaHDStudio.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LuminaHDStudio-APK
          path: build-output/LuminaHDStudio.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0
          name: "Lumina HD Studio v1.0.0 - Android APK"
          body: |
            ## Lumina HD Studio - Android APK Release

            Unduh file `LuminaHDStudio.apk` di bawah dan install langsung di HP Android Anda!

            - **Versi:** 1.0.0
            - **Platform:** Android 7.0+ (Nougat s/d Android 14)
            - **Fitur:** 4K Video Super-Resolution, Portrait Retouching, Text & UI Deblur, Pure Black Minimalist.
          files: build-output/LuminaHDStudio.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
